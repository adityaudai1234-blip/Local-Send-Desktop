[package]
name = "beamdrop"
version = "0.1.0"
description = "Cross-platform peer-to-peer local device discovery and secure file sharing"
authors = ["BeamDrop Team"]
edition = "2021"

[lib]
name = "beamdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
mdns-sd = "0.11"
local-ip-address = "0.6"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# SQLite prepared for future transfers and device history phases
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[features]
default = []
database = ["rusqlite"]
